<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archviz Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  @font-face { font-family:'Volte'; src:url('https://www.marty-designhaus.ch/typo3conf/ext/bootup/Resources/Public/Fonts/Volte/Volte-Regular.woff') format('woff'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Volte'; src:url('https://www.marty-designhaus.ch/typo3conf/ext/bootup/Resources/Public/Fonts/Volte/Volte-Medium.woff') format('woff'); font-weight:500; font-display:swap; }
  @font-face { font-family:'Volte'; src:url('https://www.marty-designhaus.ch/typo3conf/ext/bootup/Resources/Public/Fonts/Volte/Volte-Semibold.woff') format('woff'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Volte'; src:url('https://www.marty-designhaus.ch/typo3conf/ext/bootup/Resources/Public/Fonts/Volte/Volte-Bold.woff') format('woff'); font-weight:700; font-display:swap; }

  :root{
    --bg:#2b2a29; --bg-panel:#393737; --bg-panel-hover:#464343; --bg-sunken:#302e2d;
    --copper:#a3775c; --copper-bright:#c7a688; --copper-deep:#725340;
    --white:#f1ece7; --stone:#9a938d; --line:#3f3d3c; --focus:#c7a688;
    --font-display:'Volte','Archivo Expanded','Arial Narrow',sans-serif;
    --font-body:'Work Sans',-apple-system,'Segoe UI',sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    --radius:10px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  html{height:100%}
  body{
    height:100%;overflow:hidden;display:flex;flex-direction:column;font-size:14px;line-height:1.55;
    background-image:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(163,119,92,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(163,119,92,0.07), transparent 60%);
    background-attachment:fixed;
  }
  ::selection{background:var(--copper-deep);color:var(--white)}

  /* ---------------- header ---------------- */
  header{
    padding:clamp(22px,3.4vw,40px) clamp(18px,4vw,48px) 0;
    max-width:1760px;width:100%;margin:0 auto;
  }
  .wordmark{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .wordmark .logo{height:24px;width:auto;display:block}
  h1{
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(24px,3vw,42px);line-height:1.02;margin:0;
    color:var(--copper);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;
  }

  /* ---------------- layout ---------------- */
  .app{
    flex:1;min-height:0;
    max-width:1760px;width:100%;margin:0 auto;
    padding:clamp(18px,2.4vw,28px) clamp(18px,4vw,48px) 0;
    display:grid;gap:16px;overflow:hidden;
    grid-template-columns:340px minmax(0,1.3fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
  }
  .panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .panel-head{
    padding:14px 18px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;flex:none;
  }
  .panel-head h2{
    margin:0;font-family:var(--font-display);font-weight:700;font-size:11.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--copper);
  }
  .panel-head .count{font-size:11px;color:var(--stone);letter-spacing:.03em;margin-left:auto}
  .panel-body{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
  .panel-body::-webkit-scrollbar{width:9px}
  .panel-body::-webkit-scrollbar-track{background:transparent}
  .panel-body::-webkit-scrollbar-thumb{background:#4d4a48;border-radius:99px;border:2px solid var(--bg-panel)}
  .panel-body::-webkit-scrollbar-thumb:hover{background:var(--copper-deep)}

  /* ---------------- setup column ---------------- */
  .eyebrow{
    font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--copper);font-weight:700;
  }
  .group{margin-bottom:24px}
  .group:last-child{margin-bottom:0}
  .group-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:8px;
  }
  .mini-btn{
    background:none;border:none;color:var(--stone);cursor:pointer;font-family:var(--font-body);
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;
    transition:color .18s ease,background .18s ease;
  }
  .mini-btn:hover{color:var(--copper-bright);background:var(--bg-panel-hover)}
  .mini-btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

  label.check{
    display:flex;align-items:flex-start;gap:10px;padding:6px 8px;margin:0 -8px;
    border-radius:6px;cursor:pointer;user-select:none;transition:background .16s ease;
  }
  label.check:hover{background:var(--bg-panel-hover)}
  label.check input,.custom-row input[type=checkbox]{
    appearance:none;-webkit-appearance:none;flex:none;
    width:15px;height:15px;margin:3px 0 0;
    border:1.5px solid #575351;border-radius:3px;background:var(--bg-sunken);
    cursor:pointer;position:relative;transition:background .15s ease,border-color .15s ease;
  }
  label.check input:hover,.custom-row input[type=checkbox]:hover{border-color:var(--copper-deep)}
  label.check input:checked,.custom-row input[type=checkbox]:checked{background:var(--copper);border-color:var(--copper)}
  label.check input:checked::after,.custom-row input[type=checkbox]:checked::after{
    content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(43deg);
  }
  label.check input:focus-visible,.custom-row input[type=checkbox]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  label.check span{font-size:13px;color:var(--white)}

  /* custom materials */
  .custom-row{
    display:flex;align-items:center;gap:9px;padding:5px 8px;margin:0 -8px;
    border-radius:6px;transition:background .16s ease;
  }
  .custom-row:hover{background:var(--bg-panel-hover)}
  .custom-row input[type=checkbox]{margin:0}
  .custom-row input[type=text]{
    flex:1;min-width:0;background:transparent;border:none;border-bottom:1px dashed #575351;
    color:var(--white);font-family:var(--font-body);font-size:13px;padding:2px 2px 3px;
    transition:border-color .16s ease;
  }
  .custom-row input[type=text]:focus{outline:none;border-bottom-color:var(--copper);border-bottom-style:solid}
  .custom-row input[type=text]::placeholder{color:#6d6663;font-style:italic}
  .icon-btn{
    flex:none;width:20px;height:20px;border:none;background:none;border-radius:4px;cursor:pointer;
    color:var(--stone);font-size:15px;line-height:1;display:grid;place-items:center;
    font-family:var(--font-body);transition:color .16s ease,background .16s ease;
  }
  .icon-btn:hover{color:#d98a72;background:var(--bg-sunken)}
  .icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .add-btn{
    width:100%;margin-top:8px;padding:8px 10px;border-radius:6px;cursor:pointer;
    background:transparent;border:1px dashed #575351;color:var(--stone);
    font-family:var(--font-body);font-size:12px;letter-spacing:.04em;
    transition:color .16s ease,border-color .16s ease,background .16s ease;
  }
  .add-btn:hover{color:var(--copper-bright);border-color:var(--copper-deep);background:var(--bg-sunken)}
  .add-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .block-head h3 .untitled{color:var(--stone);font-style:italic;text-transform:none;letter-spacing:.02em}
  .item-head .name .untitled{color:var(--stone);font-style:italic;text-transform:none;letter-spacing:.02em}

  .fixed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .fixed-list li{
    display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--stone);
    padding:5px 8px;margin:0 -8px;cursor:pointer;border-radius:6px;
    transition:color .16s ease,background .16s ease;
  }
  .fixed-list li:hover{background:var(--bg-panel-hover);color:var(--copper-bright)}
  .fixed-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--copper);flex:none}

  .chips{display:flex;flex-wrap:wrap;gap:7px;padding-top:6px}
  .chip{
    border:1px solid var(--line);background:var(--bg-sunken);color:var(--stone);
    padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;
    font-family:var(--font-body);transition:all .16s ease;
  }
  .chip:hover{border-color:var(--copper-deep);color:var(--white)}
  .chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .chip.on{background:var(--copper-deep);border-color:var(--copper);color:var(--white)}

  .field label{display:block;margin-bottom:5px}
  .field input[type=text]{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;
    font-family:var(--font-body);font-size:13px;background:var(--bg-sunken);color:var(--white);
    transition:border-color .16s ease,box-shadow .16s ease;
  }
  .field input[type=text]:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px rgba(163,119,92,.18)}

  .actions{
    flex:none;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg-panel);
    display:flex;flex-direction:column;gap:8px;
  }
  .btn{
    width:100%;padding:12px 14px;border-radius:6px;cursor:pointer;
    font-family:var(--font-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:700;border:1px solid transparent;transition:all .18s ease;
  }
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .btn-primary{background:var(--copper);color:#241f1c}
  .btn-primary:hover{background:var(--copper-bright)}
  .btn-primary:active{transform:scale(.99)}
  .btn-secondary{background:var(--bg-sunken);color:var(--white);border-color:var(--line)}
  .btn-secondary:hover{background:var(--bg-panel-hover);border-color:var(--copper-deep)}
  .btn-ghost{
    background:none;border:none;color:var(--stone);font-family:var(--font-body);
    text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;padding:2px;
  }
  .btn-ghost:hover{color:var(--copper-bright)}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{flex:1;min-width:0}
  .btn-sm{padding:9px 8px;font-size:10.5px;letter-spacing:.08em}

  /* ---------------- blocks ---------------- */
  .block{
    background:var(--bg-sunken);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;
  }
  .block:last-child{margin-bottom:0}
  .block:hover{border-color:#4a4644}
  .block-head{display:flex;align-items:center;gap:10px;padding:11px 14px}
  .block-head .num{
    font-family:var(--font-display);font-size:10.5px;font-weight:700;color:var(--copper-bright);
    background:var(--copper-deep);width:20px;height:20px;border-radius:4px;
    display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums;
  }
  .block-head h3{
    margin:0;font-family:var(--font-display);font-weight:700;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--white);
  }
  .block-head .tag{
    margin-left:auto;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--stone);border:1px solid var(--line);padding:2px 9px;border-radius:999px;flex:none;
  }
  .block-head .tag.active{color:var(--copper-bright);border-color:var(--copper-deep)}
  .block-body{padding:0 14px 12px}

  .item{padding:10px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none;padding-top:2px}
  .item-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;min-height:20px}
  .item-head .name{
    font-family:var(--font-display);font-size:10.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--copper);
  }
  .item-head .spacer{flex:1}
  .edited{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
  textarea{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;
    font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--white);
    background:var(--bg);resize:vertical;min-height:52px;overflow:hidden;
    transition:border-color .16s ease,box-shadow .16s ease;
  }
  textarea:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px rgba(163,119,92,.18)}
  textarea::placeholder{color:#6d6663}
  .empty{color:var(--stone);font-size:12.5px;font-style:italic;padding:2px 0 4px}

  /* ---------------- output ---------------- */
  .out-opts{display:flex;flex-wrap:wrap;gap:2px 16px;margin-bottom:12px}
  .out-opts label.check{padding:4px 0;margin:0}
  .out-opts label.check:hover{background:none}
  .out-opts label.check span{color:var(--stone);font-size:12.5px}
  .stats{display:flex;gap:16px;margin-bottom:12px;font-size:11px;color:var(--stone);letter-spacing:.05em}
  .stats b{color:var(--copper-bright);font-weight:600;font-variant-numeric:tabular-nums}
  pre#final{
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin:0;white-space:pre-wrap;word-wrap:break-word;
    font-family:var(--font-mono);font-size:12px;line-height:1.7;color:#ddd6d0;
  }

  /* ---------------- footer / toast ---------------- */
  footer{
    padding:16px clamp(18px,4vw,48px) clamp(18px,2.6vw,28px);
    max-width:1760px;width:100%;margin:0 auto;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  footer .note{font-size:11.5px;color:var(--stone);letter-spacing:.02em}
  footer .note b{color:var(--copper);font-weight:600}
  .site-link{color:var(--stone);text-decoration:none;border-bottom:1px solid var(--line);transition:color .2s ease,border-color .2s ease}
  .site-link:hover,.site-link:focus-visible{color:var(--copper-bright);border-color:var(--copper-bright)}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);
    background:var(--bg-panel);color:var(--white);padding:11px 20px;border-radius:8px;
    font-size:12.5px;letter-spacing:.03em;opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;
    border:1px solid var(--line);border-left:3px solid var(--copper);
    box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }

  @media (max-width:1200px){
    html,body{height:auto;overflow:visible}
    .app{grid-template-columns:1fr;grid-template-rows:none;overflow:visible;padding-bottom:8px}
    .panel{overflow:visible}
    .panel-body{overflow:visible}
  }
</style>
</head>

  <h1>Archviz Prompt Builder</h1>
</header>

<div class="app">

  <!-- ============ LEFT : SETUP ============ -->
  <section class="panel" id="setup">
    <div class="panel-head"><h2>Setup</h2><span class="count" id="setupCount"></span></div>
    <div class="panel-body">

      <div class="group field">
        <label class="eyebrow" for="projectName">Project / file name</label>
        <input type="text" id="projectName" value="archviz-prompt" spellcheck="false">
      </div>

      <div class="group">
        <div class="group-head"><span class="eyebrow">Always included</span></div>
        <ul class="fixed-list" id="fixedList"></ul>
      </div>

      <div class="group" id="group-materials"></div>
      <div class="group" id="group-landscaping"></div>
      <div class="group" id="group-optional"></div>

      <div class="group">
        <div class="group-head"><span class="eyebrow">Furniture brand reference</span></div>
        <div class="chips" id="brandChips"></div>
      </div>

    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btnDownload">Download .txt</button>
      <button class="btn btn-secondary" id="btnCopy">Copy prompt</button>
      <div class="btn-row">
        <button class="btn btn-secondary btn-sm" id="btnExport" title="Save the whole setup as a .json file you can load again later">Save setup</button>
        <button class="btn btn-secondary btn-sm" id="btnImport" title="Load a setup you saved earlier">Load setup</button>
      </div>
      <button class="btn btn-ghost" id="btnReset">Reset all texts to defaults</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
  </section>

  <!-- ============ MIDDLE : BLOCKS ============ -->
  <section class="panel" id="blocks">
    <div class="panel-head"><h2>Prompt blocks</h2><span class="count">click a text to edit it</span></div>
    <div class="panel-body" id="blockList"></div>
  </section>

  <!-- ============ RIGHT : FINAL PROMPT ============ -->
  <section class="panel" id="output">
    <div class="panel-head"><h2>Final prompt</h2></div>
    <div class="panel-body">
      <div class="out-opts">
        <label class="check"><input type="checkbox" id="optHeadings" checked><span>Section headings</span></label>
        <label class="check"><input type="checkbox" id="optBullets" checked><span>Bullet list for materials</span></label>
      </div>
      <div class="stats">
        <span><b id="statWords">0</b> words</span>
        <span><b id="statChars">0</b> characters</span>
      </div>
      <pre id="final"></pre>
    </div>
  </section>

</div>

<footer>
  <span class="note">Archviz Prompt Builder</span>
  <span class="note">MDH &middot; <a class="site-link" href="https://www.marty-designhaus.ch/" target="_blank" rel="noopener noreferrer">marty-designhaus.ch</a></span>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIG — all default texts live here. Edit freely.
   type "fixed"    -> always in the prompt, single text block
   type "optional" -> single text block with its own checkbox ("checked" sets
                      whether it starts on)
   type "group"    -> checkbox list, each item has its own text block
   ===================================================================== */
const INTRO = "transform this 3D architectural render into a photorealistic photograph of a modern residential house.";

const SECTIONS = [
  {
    id: "overall-style", title: "Overall Style", type: "fixed",
    text: "photorealistic architectural photography, shot on a full-frame camera with a wide-angle lens, natural color grading, realistic material reflectivity and shadow softness, no CGI look, no oversaturation — resembling a professional real estate / architecture photo shoot."
  },
  {
    id: "lighting", title: "Lighting & Atmosphere", type: "fixed",
    text: "believable bright blue sky with soft natural clouds. natural daylight, realistic shadows"
  },
  {
    id: "color-temperature", title: "Color Temperature", type: "fixed",
    text: "no warm interior lighting — interiors should read as dim and neutral, glass slightly reflective rather than glowing."
  },
  {
    id: "sky", title: "Sky", type: "fixed",
    text: "believable bright blue sky with soft natural clouds. natural daylight, realistic shadows"
  },
  {
    id: "materials", title: "Materials", type: "group",
    items: [
      { id:"asphalt",       label:"Asphalt",                  text:"fine-grained dark grey asphalt, matte and slightly worn, realistic aggregate texture with subtle tonal variation, no visible seams" },
      { id:"concrete",      label:"Concrete",                 text:"fair-faced concrete with fine formwork texture, neutral grey, matte finish, subtle cloudy variation and crisp clean edges" },
      { id:"retaining",     label:"Concrete Retaining Wall",  text:"board-formed exposed concrete, subtle formwork lines, neutral grey, slight natural weathering towards the base" },
      { id:"floor-terrace", label:"Flooring Terrace",         text:"large-format grey stone slabs, matte surface, narrow even joints, realistic micro-texture and soft contact shadows" },
      { id:"floor-drive",   label:"Flooring Driveway",        text:"light grey cobblestone in a regular bond, matte, fine joints, subtle color variation between individual units" },
      { id:"embankment",    label:"Embankment Stone",         text:"natural quarried stone blocks with irregular faces, grey tones, dry-stacked look with realistic gaps and shadows" },
      { id:"roof-tiles",    label:"Roof Tiles",               text:"anthracite clay roof tiles (#3D3D3A), matte, regular coursing, realistic depth and shadow between the rows, no reflection" },
      { id:"win-frame",     label:"Windows Frame",            text:"slim dark anthracite metal frames (#3A3A3D), matte powder-coated finish, crisp shadow lines" },
      { id:"win-glass",     label:"Windows Glass",            text:"realistic reflections of sky and surroundings, faint green-grey tint, no glow, no interior lights" },
      { id:"roof-edge",     label:"Metal Roof Edge",          text:"dark anthracite folded sheet metal trim (#3A3A3D), matte, precise clean lines with a thin shadow gap" },
      { id:"railing",       label:"Metal Railing",            text:"slim dark powder-coated steel railing (#3A3A3D), minimal profile, matte finish" },
      { id:"pebble",        label:"Pebble",                   text:"rounded grey gravel bed, evenly distributed, realistic scale with small shadows between the stones" },
      { id:"facade-1",      label:"Facade Color 1",           text:"fine mineral plaster (2mm grain) in a white (#FCFCFA), matte, subtle surface grain" },
      { id:"facade-2",      label:"Facade Color 2",           text:"fine mineral plaster (2mm grain) in a grey (#757572), matte, subtle surface grain" },
      { id:"facade-stone-1",  label:"Facade Stone 1",         text:"valser quartzite cladding in narrow split-face strips laid in horizontal courses of random length and slightly varying height, cleft natural surface with shallow relief between the strips, deep narrow shadow joints, cool grey to grey-green stone with fine silver mica flecks that catch the light without gloss, pale white-grey quartz veining and soft cloudy marbling, occasional darker blue-anthracite strips for tonal variation, matte to faintly satin, no polish or reflection" },
      { id:"facade-stone-2",  label:"Facade Stone 2",         text:"svlser quartzite cladding in narrow split-face strips laid in horizontal courses of random length and slightly varying height, cleft natural surface with shallow relief between the strips, deep narrow shadow joints, warm sand-beige to greige stone with soft ochre and light rust undertones, fine golden mica flecks catching the light without gloss, creamy off-white veining and gentle cloudy marbling, occasional deeper brown-grey strips for tonal variation, matte to faintly satin, no polish or reflection" }
    ],
    custom: true
  },
  {
    id: "landscaping", title: "Landscaping", type: "group",
    items: [
      { id:"ls-general", label:"General", checked:true, text:"general landscaping should read as a real Central European residential garden, tasteful and minimal" },
      { id:"ls-lawn",    label:"Lawn",    checked:true, text:"realistic well-maintained residential grass, natural green tone with slight texture variation, subtle mowing lines" },
      { id:"ls-slope",   label:"Slope",   text:"naturally graded planted embankment with low ground cover and ornamental grasses, even coverage, no bare soil patches" }
    ]
  },
  {
    id: "outdoor-furniture", title: "Outdoor Furniture", type: "fixed",
    template: "modern outdoor furniture on the terrace (chairs, small table, lounge elements){BRANDS}.",
    brands: ["Dedon","Royal Botania","Minotti","B&B Italia","Gandia Blasco"],
    activeBrands: ["Dedon","Royal Botania"]
  },
  {
    id: "indoor-furniture", title: "Indoor Furniture", type: "optional", checked: false,
    text: "furniture and styling visible through the glass: modern scandinavian / nordic style with light oak wood tones, black metal accents and minimal clean-lined pieces."
  }
];

/* =====================================================================
   STATE
   ===================================================================== */
const state = { checked:{}, texts:{}, edited:{}, brands:[], custom:[], customSeq:0 };

/* custom materials the user adds at runtime live in state.custom as
   { id, label } — their description text sits in state.texts like every
   other item, so assembly and editing need no special case. */
function isCustom(id){ return state.custom.some(c => c.id === id); }

/* everything the user can switch on or off: group items plus optional sections */
function selectedCount(){
  return SECTIONS.filter(s => s.type === "group")
           .reduce((a,s) => a + itemsOf(s).filter(i => state.checked[i.id]).length, 0)
       + SECTIONS.filter(s => s.type === "optional" && state.checked[s.id]).length;
}
function itemsOf(sec){ return sec.custom ? sec.items.concat(state.custom) : sec.items; }

function defaultTextFor(key){
  for(const s of SECTIONS){
    if((s.type === "fixed" || s.type === "optional") && s.id === key) return s.template ? renderTemplate(s) : s.text;
    if(s.type === "group"){
      const it = (s.items||[]).find(i => i.id === key);
      if(it) return it.text;
    }
  }
  return "";
}

function renderTemplate(sec){
  const b = state.brands.length ? ", in the style of " + listJoin(state.brands) : "";
  return sec.template.replace("{BRANDS}", b);
}

function listJoin(arr){
  if(arr.length === 1) return arr[0];
  return arr.slice(0,-1).join(", ") + " or " + arr[arr.length-1];
}

function initState(){
  // custom materials are the user's own content, not a default — carry them through
  const keptCustom = state.custom.map(c => ({ id:c.id, text:state.texts[c.id] || "", on:state.checked[c.id] !== false }));
  state.checked = {}; state.texts = {}; state.edited = {};
  keptCustom.forEach(c => { state.texts[c.id] = c.text; state.checked[c.id] = c.on; });
  SECTIONS.forEach(s => {
    if(s.type === "fixed" || s.type === "optional"){
      if(s.brands) state.brands = [...(s.activeBrands||[])];
      state.texts[s.id] = s.template ? renderTemplate(s) : s.text;
      if(s.type === "optional") state.checked[s.id] = !!s.checked;
    } else {
      s.items.forEach(i => {
        state.checked[i.id] = !!i.checked;
        state.texts[i.id] = i.text;
      });
    }
  });
  state.texts.__intro = INTRO;
}

/* =====================================================================
   SETUP COLUMN
   ===================================================================== */
function customRow(c){
  const row = document.createElement("div");
  row.className = "custom-row";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!state.checked[c.id];
  cb.title = "Include in the prompt";
  cb.onchange = () => { state.checked[c.id] = cb.checked; buildBlocks(); update(); };

  const name = document.createElement("input");
  name.type = "text";
  name.value = c.label;
  name.placeholder = "Material name";
  name.spellcheck = false;
  name.setAttribute("data-name-for", c.id);
  // rebuilding the sidebar here would steal focus mid-typing, so only the
  // block column and the assembled prompt are refreshed
  name.oninput = () => { c.label = name.value; buildBlocks(); update(); };

  const del = document.createElement("button");
  del.className = "icon-btn";
  del.innerHTML = "&times;";
  del.title = "Remove this material";
  del.setAttribute("aria-label", "Remove custom material");
  del.onclick = () => {
    state.custom = state.custom.filter(x => x.id !== c.id);
    delete state.texts[c.id];
    delete state.checked[c.id];
    buildSetup(); buildBlocks(); update();
  };

  row.appendChild(cb); row.appendChild(name); row.appendChild(del);
  return row;
}

function buildSetup(){
  const ul = document.getElementById("fixedList");
  ul.innerHTML = "";
  SECTIONS.filter(s => s.type === "fixed").forEach(s => {
    const li = document.createElement("li");
    li.textContent = s.title;
    li.title = "Jump to this block";
    li.onclick = () => {
      const el = document.getElementById("block-" + s.id);
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.style.borderColor = "var(--copper)";
      el.style.boxShadow = "0 0 0 3px rgba(163,119,92,.18)";
      setTimeout(() => { el.style.borderColor = ""; el.style.boxShadow = ""; }, 1000);
    };
    ul.appendChild(li);
  });

  SECTIONS.filter(s => s.type === "group").forEach(s => {
    const host = document.getElementById("group-" + s.id);
    host.innerHTML = "";

    const head = document.createElement("div");
    head.className = "group-head";
    const t = document.createElement("span");
    t.className = "eyebrow"; t.textContent = s.title;
    const btn = document.createElement("button");
    btn.className = "mini-btn"; btn.textContent = "All / none";
    btn.onclick = () => {
      const all = itemsOf(s);
      const anyOff = all.some(i => !state.checked[i.id]);
      all.forEach(i => state.checked[i.id] = anyOff);
      buildSetup(); buildBlocks(); update();
    };
    head.appendChild(t); head.appendChild(btn);
    host.appendChild(head);

    s.items.forEach(i => {
      const lab = document.createElement("label");
      lab.className = "check";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state.checked[i.id];
      cb.onchange = () => { state.checked[i.id] = cb.checked; buildBlocks(); update(); };
      const sp = document.createElement("span");
      sp.textContent = i.label;
      lab.appendChild(cb); lab.appendChild(sp);
      host.appendChild(lab);
    });

    if(s.custom){
      state.custom.forEach(c => host.appendChild(customRow(c)));

      const add = document.createElement("button");
      add.className = "add-btn";
      add.textContent = "+ Add custom material";
      add.onclick = () => {
        const id = "custom-" + (++state.customSeq);
        state.custom.push({ id:id, label:"" });
        state.texts[id] = "";
        state.checked[id] = true;
        buildSetup(); buildBlocks(); update();
        const input = document.querySelector('[data-name-for="' + id + '"]');
        if(input) input.focus();
      };
      host.appendChild(add);
    }
  });

  // optional single-text sections — one checkbox each, no per-item labels
  const optHost = document.getElementById("group-optional");
  optHost.innerHTML = "";
  const optionals = SECTIONS.filter(s => s.type === "optional");
  if(optionals.length){
    const oh = document.createElement("div");
    oh.className = "group-head";
    const ot = document.createElement("span");
    ot.className = "eyebrow"; ot.textContent = "Optional sections";
    oh.appendChild(ot);
    optHost.appendChild(oh);
    optionals.forEach(s => {
      const lab = document.createElement("label");
      lab.className = "check";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state.checked[s.id];
      cb.onchange = () => { state.checked[s.id] = cb.checked; buildBlocks(); update(); };
      const sp = document.createElement("span");
      sp.textContent = s.title;
      lab.appendChild(cb); lab.appendChild(sp);
      optHost.appendChild(lab);
    });
  }

  const sec = SECTIONS.find(s => s.brands);
  const wrap = document.getElementById("brandChips");
  wrap.innerHTML = "";
  sec.brands.forEach(b => {
    const c = document.createElement("button");
    c.className = "chip" + (state.brands.includes(b) ? " on" : "");
    c.textContent = b;
    c.setAttribute("aria-pressed", state.brands.includes(b));
    c.onclick = () => {
      const idx = state.brands.indexOf(b);
      if(idx > -1) state.brands.splice(idx,1); else state.brands.push(b);
      if(!state.edited[sec.id]) state.texts[sec.id] = renderTemplate(sec);
      buildSetup(); buildBlocks(); update();
    };
    wrap.appendChild(c);
  });

  document.getElementById("setupCount").textContent = selectedCount() + " optional selected";
}

/* =====================================================================
   BLOCK COLUMN
   ===================================================================== */
function autoGrow(ta){
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + 2) + "px";
}

function makeTextarea(key){
  const ta = document.createElement("textarea");
  ta.value = state.texts[key] || "";
  ta.rows = 2;
  ta.oninput = () => {
    state.texts[key] = ta.value;
    state.edited[key] = ta.value !== defaultTextFor(key);
    autoGrow(ta); update();
  };
  requestAnimationFrame(() => autoGrow(ta));
  return ta;
}

function resetButton(key){
  const b = document.createElement("button");
  b.className = "mini-btn"; b.textContent = "Reset";
  b.onclick = () => {
    state.texts[key] = defaultTextFor(key);
    state.edited[key] = false;
    buildBlocks(); update();
  };
  return b;
}

function buildBlocks(){
  const host = document.getElementById("blockList");
  host.innerHTML = "";

  // opening line
  const box0 = document.createElement("div");
  box0.className = "block"; box0.id = "block-intro";
  const h0 = document.createElement("div");
  h0.className = "block-head";
  h0.innerHTML = '<div class="num">0</div><h3>Opening line</h3><div class="tag">always</div>';
  const b0 = document.createElement("div");
  b0.className = "block-body";
  const ta0 = document.createElement("textarea");
  ta0.value = state.texts.__intro;
  ta0.oninput = () => { state.texts.__intro = ta0.value; autoGrow(ta0); update(); };
  requestAnimationFrame(() => autoGrow(ta0));
  b0.appendChild(ta0);
  box0.appendChild(h0); box0.appendChild(b0);
  host.appendChild(box0);

  let n = 0;
  SECTIONS.forEach(sec => {
    const single = sec.type === "fixed" || sec.type === "optional";
    const optOn  = sec.type !== "optional" || !!state.checked[sec.id];
    const active = single ? true : itemsOf(sec).filter(i => state.checked[i.id]);
    n++;

    const box = document.createElement("div");
    box.className = "block"; box.id = "block-" + sec.id;

    const head = document.createElement("div");
    head.className = "block-head";
    head.innerHTML = '<div class="num">' + n + '</div><h3>' + sec.title + '</h3>';
    const tag = document.createElement("div");
    tag.className = "tag" + (((sec.type === "group" && active.length) || (sec.type === "optional" && optOn)) ? " active" : "");
    tag.textContent = sec.type === "fixed"    ? "always"
                    : sec.type === "optional" ? (optOn ? "included" : "off")
                    : active.length + " selected";
    head.appendChild(tag);
    box.appendChild(head);

    const body = document.createElement("div");
    body.className = "block-body";

    if(single && !optOn){
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "Not included — tick it under Optional sections to add it.";
      body.appendChild(p);
    } else if(single){
      if(state.edited[sec.id]){
        const e = document.createElement("span"); e.className = "edited"; e.textContent = "edited";
        head.appendChild(e);
      }
      head.appendChild(resetButton(sec.id));
      body.appendChild(makeTextarea(sec.id));
    } else if(!active.length){
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "Nothing selected — this section is left out of the prompt.";
      body.appendChild(p);
    } else {
      active.forEach(i => {
        const item = document.createElement("div");
        item.className = "item";
        const h = document.createElement("div");
        h.className = "item-head";
        const nm = document.createElement("div");
        nm.className = "name";
        if(i.label) nm.textContent = i.label;
        else nm.innerHTML = '<span class="untitled">Unnamed material</span>';
        const sp = document.createElement("div"); sp.className = "spacer";
        h.appendChild(nm); h.appendChild(sp);
        if(isCustom(i.id)){
          const c = document.createElement("span");
          c.className = "edited"; c.textContent = "custom";
          h.appendChild(c);
        } else {
          if(state.edited[i.id]){
            const e = document.createElement("span"); e.className = "edited"; e.textContent = "edited";
            h.appendChild(e);
          }
          h.appendChild(resetButton(i.id));
        }
        item.appendChild(h);
        const ta = makeTextarea(i.id);
        if(isCustom(i.id)) ta.placeholder = "Describe this material — texture, color, finish, reflectivity";
        item.appendChild(ta);
        body.appendChild(item);
      });
    }

    box.appendChild(body);
    host.appendChild(box);
  });
}

/* =====================================================================
   PROMPT ASSEMBLY
   ===================================================================== */
function buildPrompt(){
  const headings = document.getElementById("optHeadings").checked;
  const bullets  = document.getElementById("optBullets").checked;
  const parts = [];

  const intro = (state.texts.__intro || "").trim();
  if(intro) parts.push(intro);

  SECTIONS.forEach(sec => {
    let bodyText = "";
    if(sec.type === "fixed" || sec.type === "optional"){
      if(sec.type === "optional" && !state.checked[sec.id]) return;
      bodyText = (state.texts[sec.id] || "").trim();
    } else {
      const active = itemsOf(sec).filter(i => state.checked[i.id] && (state.texts[i.id]||"").trim());
      if(!active.length) return;
      bodyText = active.map(i => {
        const t = (state.texts[i.id] || "").trim();
        const label = (i.label || "").trim();
        const line = label ? label + ": " + t : t;   // an unnamed custom material contributes its text alone
        return bullets ? "- " + line : line;
      }).join(bullets ? "\n" : " ");
    }
    if(!bodyText) return;
    parts.push(headings ? sec.title.toUpperCase() + "\n" + bodyText : bodyText);
  });

  return parts.join("\n\n");
}

function update(){
  const txt = buildPrompt();
  document.getElementById("final").textContent = txt;
  document.getElementById("statChars").textContent = txt.length;
  document.getElementById("statWords").textContent = txt.trim() ? txt.trim().split(/\s+/).length : 0;
  document.getElementById("setupCount").textContent = selectedCount() + " optional selected";
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 1900);
}

function slugName(){
  const raw = (document.getElementById("projectName").value || "archviz-prompt").trim();
  return raw.toLowerCase().replace(/[^a-z0-9\-_]+/g,"-").replace(/^-+|-+$/g,"") || "archviz-prompt";
}

function stamp(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function fileName(){ return slugName() + "_" + stamp() + ".txt"; }
function setupFileName(){ return slugName() + "_setup_" + stamp() + ".json"; }

function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("btnDownload").onclick = () => {
  downloadFile(fileName(), buildPrompt(), "text/plain");
  toast("Saved as " + fileName());
};

/* =====================================================================
   SAVE / LOAD SETUP
   The .json holds everything the page can't otherwise remember: which
   items are on, every text as currently edited, the custom materials,
   the brand chips and the output options.
   ===================================================================== */
const SETUP_FORMAT = "archviz-prompt-builder";
const SETUP_VERSION = 2;

function exportSetup(){
  const data = {
    app: SETUP_FORMAT,
    version: SETUP_VERSION,
    savedAt: new Date().toISOString(),
    projectName: document.getElementById("projectName").value || "",
    options: {
      headings: document.getElementById("optHeadings").checked,
      bullets:  document.getElementById("optBullets").checked
    },
    brands: [...state.brands],
    opening: state.texts.__intro || "",
    fixed: {},
    optional: {},
    groups: {},
    custom: state.custom.map(c => ({
      name: c.label || "",
      text: state.texts[c.id] || "",
      on:   !!state.checked[c.id]
    }))
  };
  SECTIONS.forEach(s => {
    if(s.type === "fixed"){
      data.fixed[s.id] = state.texts[s.id] || "";
    } else if(s.type === "optional"){
      data.optional[s.id] = { on: !!state.checked[s.id], text: state.texts[s.id] || "" };
    } else {
      const g = {};
      s.items.forEach(i => { g[i.id] = { on: !!state.checked[i.id], text: state.texts[i.id] || "" }; });
      data.groups[s.id] = g;
    }
  });
  return data;
}

function applySetup(data){
  if(!data || typeof data !== "object" || Array.isArray(data)) throw new Error("shape");
  if(data.app !== SETUP_FORMAT) throw new Error("wrong-app");

  // start from defaults, so a partial or older file still lands somewhere sane
  state.custom = [];
  state.customSeq = 0;
  initState();

  if(typeof data.projectName === "string" && data.projectName.trim()){
    document.getElementById("projectName").value = data.projectName;
  }
  if(data.options && typeof data.options === "object"){
    if(typeof data.options.headings === "boolean") document.getElementById("optHeadings").checked = data.options.headings;
    if(typeof data.options.bullets  === "boolean") document.getElementById("optBullets").checked  = data.options.bullets;
  }
  const brandSec = SECTIONS.find(s => s.brands);
  if(Array.isArray(data.brands) && brandSec){
    state.brands = data.brands.filter(b => brandSec.brands.includes(b));
  }
  if(typeof data.opening === "string") state.texts.__intro = data.opening;

  SECTIONS.forEach(s => {
    if(s.type === "fixed"){
      const t = data.fixed && data.fixed[s.id];
      if(typeof t === "string") state.texts[s.id] = t;
      else if(s.template) state.texts[s.id] = renderTemplate(s);   // recompose from the imported brands
      state.edited[s.id] = state.texts[s.id] !== defaultTextFor(s.id);
    } else if(s.type === "optional"){
      const e = data.optional && data.optional[s.id];
      if(e && typeof e === "object"){
        if(typeof e.on === "boolean")  state.checked[s.id] = e.on;
        if(typeof e.text === "string") state.texts[s.id] = e.text;
      } else if(data.fixed && typeof data.fixed[s.id] === "string"){
        // v1 file: this section was always-on back then, so honour that
        state.texts[s.id] = data.fixed[s.id];
        state.checked[s.id] = true;
      }
      state.edited[s.id] = state.texts[s.id] !== defaultTextFor(s.id);
    } else {
      const g = (data.groups && data.groups[s.id]) || {};
      s.items.forEach(i => {
        const e = g[i.id];
        if(!e || typeof e !== "object") return;
        if(typeof e.on === "boolean")  state.checked[i.id] = e.on;
        if(typeof e.text === "string") state.texts[i.id] = e.text;
        state.edited[i.id] = state.texts[i.id] !== i.text;
      });
    }
  });

  if(Array.isArray(data.custom)){
    data.custom.forEach(c => {
      if(!c || typeof c !== "object") return;
      const id = "custom-" + (++state.customSeq);
      state.custom.push({ id: id, label: typeof c.name === "string" ? c.name : "" });
      state.texts[id]   = typeof c.text === "string" ? c.text : "";
      state.checked[id] = c.on !== false;
    });
  }
}

document.getElementById("btnExport").onclick = () => {
  downloadFile(setupFileName(), JSON.stringify(exportSetup(), null, 2), "application/json");
  toast("Setup saved as " + setupFileName());
};

document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();

document.getElementById("fileImport").onchange = ev => {
  const input = ev.target;
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ input.value = ""; toast("That file isn't valid JSON."); return; }
    try { applySetup(data); }
    catch(e){
      input.value = "";
      toast(e.message === "wrong-app"
        ? "That JSON isn't an Archviz Prompt Builder setup."
        : "Could not read that setup file.");
      return;
    }
    buildSetup(); buildBlocks(); update();
    input.value = "";
    toast("Loaded " + file.name);
  };
  reader.onerror = () => { input.value = ""; toast("Could not read that file."); };
  reader.readAsText(file);
};

document.getElementById("btnCopy").onclick = async () => {
  const txt = buildPrompt();
  try { await navigator.clipboard.writeText(txt); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast("Prompt copied to clipboard");
};

document.getElementById("btnReset").onclick = () => {
  const keep = {...state.checked};
  initState();
  state.checked = keep;
  buildSetup(); buildBlocks(); update();
  toast("All texts reset to defaults");
};

document.getElementById("optHeadings").onchange = update;
document.getElementById("optBullets").onchange = update;

/* ---------------- boot ---------------- */
initState();
buildSetup();
buildBlocks();
update();
</script>
</body>
</html>
